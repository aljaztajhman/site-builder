# Local services for `pnpm dev`: Postgres (app data + pg-boss queue) and MinIO (S3-compatible storage).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sitebuilder
      POSTGRES_PASSWORD: sitebuilder
      POSTGRES_DB: sitebuilder
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitebuilder"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sitebuilder
      MINIO_ROOT_PASSWORD: sitebuilder-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  # Creates the bucket once MinIO is up.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 sitebuilder sitebuilder-secret && mc mb --ignore-existing local/sitebuilder"

volumes:
  pgdata:
  miniodata:
