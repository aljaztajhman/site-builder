name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only pull requests (only .md files, docs/ or TASKS.md changed) skip the test, slow, motion and eval jobs;
  # typecheck, lint, the build and migrations still run. On other pull requests the slow tier and the motion suite
  # run only the test files related to the change (vitest --changed), unless shared config, the lockfile, test setup
  # or CI changed (full). Pushes to main always run everything, so main's own CI is the full net.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      full: ${{ steps.diff.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; echo "full=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD)
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/.*|.*\.md)$'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          # Files the module graph can't see (JSON config read at runtime, the lockfile, test setup, CI): run every test.
          if echo "$files" | grep -qE '^(config/|\.github/|pnpm-lock\.yaml$|package\.json$|vitest\.config\.ts$|test-setup\.ts$|tsconfig.*\.json$|.*/package\.json$)'; then echo "full=true" >> "$GITHUB_OUTPUT"; else echo "full=false" >> "$GITHUB_OUTPUT"; fi

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  # Tests in two tiers (vitest.config.ts; docs/dev/agent-team.md, "Test tiers"); both run on every PR. The fast tier
  # (`pnpm test`: unit tests and cheap browser checks) on one runner.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium for render checks
        run: pnpm --filter @sb/engine exec playwright install --with-deps chromium
      - run: pnpm test

  # The slow tier (`pnpm test:slow`: files marked `// @module-tag slow`, the browser suites and generation replays),
  # split over five runners by file (vitest --shard): on one runner they take far longer than the job's limit. The motion
  # suite (CPU-throttled timing measurements, 12 min alone) runs in test-motion instead (SB_MOTION_OWN_JOB).
  test-slow:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    name: test-slow (${{ matrix.shard }}/5)
    env:
      SB_MOTION_OWN_JOB: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium for render checks
        run: pnpm --filter @sb/engine exec playwright install --with-deps chromium
      # Processed fixture photos (test-setup.ts): a re-run on the same encode settings and sharp build skips the AVIF/WebP work.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/sb-test-media
          key: test-media-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml', 'packages/engine/src/images.ts', 'packages/engine/src/photo-cache.ts', 'packages/render/src/images.ts', 'config/app.config.json') }}
      - run: pnpm test:slow --shard=${{ matrix.shard }}/5 ${{ needs.changes.outputs.full != 'true' && format('--changed {0} --passWithNoTests', github.event.pull_request.base.sha) || '' }}

  # The motion presets in a browser (tools/eval/test/motion.test.ts), every third preset per runner: its LCP and CLS
  # measurements run on a runner of their own, not beside other browser suites.
  test-motion:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3]
    name: test-motion (${{ matrix.slice }}/3)
    env:
      SB_MOTION_SLICE: ${{ matrix.slice }}/3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium for render checks
        run: pnpm --filter @sb/engine exec playwright install --with-deps chromium
      - run: pnpm exec vitest run --project slow tools/eval/test/motion.test.ts ${{ needs.changes.outputs.full != 'true' && format('--changed {0} --passWithNoTests', github.event.pull_request.base.sha) || '' }}

  # docs/dev/workflow.md §6, CI additions: the hand-authored golden specs through every automated check (render,
  # axe, Lighthouse, 360 px, facts, placeholders, export). No model calls, free. --strict fails the job when a
  # fixture fails a check; the report and sheets are uploaded when it does. Two runners, five fixtures each: on one
  # runner the ten took 15 minutes of the 20-minute limit (2026-10-07).
  eval-offline:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: eval-offline (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium for render checks
        run: pnpm --filter @sb/engine exec playwright install --with-deps chromium
      - run: pnpm eval --offline --strict --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: eval-offline-${{ matrix.shard }}
          path: eval/

  # The dashboard's scripts (editor, landing) and UI assets as production builds them at start, so a broken
  # bundle fails here instead of in the deploy.
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sb/web build

  # Migration smoke and migrate-check (docs/dev/workflow.md §4, §6) on Postgres 17 (as docker-compose.yml):
  # 1. every migration on an empty database, then pg-boss's schema;
  # 2. the base commit's code (the PR's target, or main before this push) migrates a database and seeds two
  #    golden sites into it; `pnpm db:backup` dumps it; `pnpm db:migrate-check` restores that dump into an
  #    empty database and runs this commit's migrations on the data, as the promote workflow does with
  #    production's newest backup.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sb
          POSTGRES_PASSWORD: sb
          POSTGRES_DB: sb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: sb
      PGPASSWORD: sb
      STORAGE_DRIVER: fs
    steps:
      - uses: actions/checkout@v4
        with:
          # This commit and its first parent: the base the migrations are checked from.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install the PostgreSQL 17 client (pg_dump and psql at the server's version)
        run: |
          [ -x /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh ] || { sudo apt-get update -qq; sudo apt-get install -y -qq postgresql-common; }
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Create the databases
        run: |
          pg_dump --version
          for db in empty base migcheck; do psql -d sb -c "create database $db"; done
      - name: Migrate an empty database
        env:
          DATABASE_URL: postgres://sb:sb@localhost:5432/empty
        run: |
          pnpm db:migrate
          pnpm db:migrate
      - name: Base commit's database with data
        env:
          DATABASE_URL: postgres://sb:sb@localhost:5432/base
          STORAGE_DIR: ${{ runner.temp }}/base-storage
        run: |
          git worktree add "$RUNNER_TEMP/base" HEAD^1
          cd "$RUNNER_TEMP/base"
          git log -1 --format='base: %h %s'
          pnpm install --frozen-lockfile
          pnpm fixtures:photos
          pnpm seed avtoservis-mrak
          pnpm seed pekarna-kvas
      - name: Back up the base database (this commit's backup script)
        env:
          DATABASE_URL: postgres://sb:sb@localhost:5432/base
          STORAGE_DIR: ${{ runner.temp }}/backups
        run: pnpm db:backup
      - name: Migrate-check this commit's migrations against that backup
        env:
          MIGRATE_CHECK_DATABASE_URL: postgres://sb:sb@localhost:5432/migcheck
          STORAGE_DIR: ${{ runner.temp }}/backups
        run: pnpm db:migrate-check
