# Nightly at 03:00 UTC (docs/dev/workflow.md §6): dependency audit, production database backup and its check,
# stale-branch report.
#
# Off until the owner turns it on, so the schedule does nothing before production exists:
# - repository variable NIGHTLY_ENABLED=true: the audit and the stale-branch report run on the schedule;
# - PRODUCTION_READY=true (and the secrets below): the backup runs (on the schedule and by hand);
# - NIGHTLY_DELETE_MERGED_BRANCHES=true: the stale branches are deleted, not only listed (workflow.md §2: merged
#   branches older than 7 days). Until then the report only lists them.
# Run by hand (workflow_dispatch), the audit and the report run whatever NIGHTLY_ENABLED says.
#
# Backup secrets: PRODUCTION_DATABASE_URL (Railway Postgres' public URL, DATABASE_PUBLIC_URL), PRODUCTION_S3_ENDPOINT,
# PRODUCTION_S3_BUCKET, PRODUCTION_S3_ACCESS_KEY_ID, PRODUCTION_S3_SECRET_ACCESS_KEY; variables PRODUCTION_S3_REGION
# and PRODUCTION_S3_FORCE_PATH_STYLE (optional). Backups go to backups/<date>.sql.gz, kept 30 days (config backups).
name: Nightly
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  audit:
    if: vars.NIGHTLY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm audit --prod

  backup:
    if: vars.PRODUCTION_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install the PostgreSQL 17 client (pg_dump at least the server's version)
        run: |
          [ -x /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh ] || { sudo apt-get update -qq; sudo apt-get install -y -qq postgresql-common; }
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Back up production and check the backup
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          STORAGE_DRIVER: s3
          S3_ENDPOINT: ${{ secrets.PRODUCTION_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.PRODUCTION_S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ vars.PRODUCTION_S3_REGION || 'auto' }}
          S3_FORCE_PATH_STYLE: ${{ vars.PRODUCTION_S3_FORCE_PATH_STYLE || 'false' }}
        run: pnpm db:backup

  branches:
    if: vars.NIGHTLY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Stale-branch report (deletes only with NIGHTLY_DELETE_MERGED_BRANCHES=true)
        env:
          GH_TOKEN: ${{ github.token }}
          DELETE: ${{ vars.NIGHTLY_DELETE_MERGED_BRANCHES }}
        run: |
          if [ "$DELETE" = "true" ]; then pnpm exec tsx tools/ops/src/branches-cli.ts --days 7 --delete; else pnpm exec tsx tools/ops/src/branches-cli.ts --days 7; fi
