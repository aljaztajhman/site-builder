# Nightly at 03:00 UTC (docs/dev/workflow.md §6): dependency audit and stale-branch report.
#
# The production database backup does not run here: it runs inside Railway as the cron service `backup`
# (Dockerfile.backup, schedule 03:00 UTC, `pnpm db:backup` with the PostgreSQL 18 client), so the database URL
# never leaves Railway. The restore drill (`pnpm db:restore-drill`) runs from the same image by hand.
#
# Off until the owner turns it on:
# - repository variable NIGHTLY_ENABLED=true: the audit and the stale-branch report run on the schedule;
# - NIGHTLY_DELETE_MERGED_BRANCHES=true: the stale branches are deleted, not only listed (workflow.md §2: merged
#   branches older than 7 days). Until then the report only lists them.
# Run by hand (workflow_dispatch), the audit and the report run whatever NIGHTLY_ENABLED says.
name: Nightly
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  audit:
    if: vars.NIGHTLY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm audit --prod

  branches:
    if: vars.NIGHTLY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Stale-branch report (deletes only with NIGHTLY_DELETE_MERGED_BRANCHES=true)
        env:
          GH_TOKEN: ${{ github.token }}
          DELETE: ${{ vars.NIGHTLY_DELETE_MERGED_BRANCHES }}
        run: |
          if [ "$DELETE" = "true" ]; then pnpm exec tsx tools/ops/src/branches-cli.ts --days 7 --delete; else pnpm exec tsx tools/ops/src/branches-cli.ts --days 7; fi
